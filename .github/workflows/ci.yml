name: CI

# CI scope (public repo): gates that don't require the Multiverse Echoes engine API.
# Backend-dependent test suites — E2E flows, authenticated-route accessibility audits —
# run in the private monorepo's CI against the same client/ source (synchronized via
# the mirror workflow). The corresponding test files (client/e2e/) remain in this repo
# for contributor reference and for contributors running locally against their own
# engine deployment. See https://developers.echolabsme.com/getting-started for engine
# access via API key.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Runs on every commit ---

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  unit-tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  # --- Runs on PR to main only ---

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check bundle size
        run: |
          MAX_SIZE_KB=1500
          DIST_SIZE=$(du -sk dist/ | cut -f1)
          echo "Bundle size: ${DIST_SIZE}KB (budget: ${MAX_SIZE_KB}KB)"
          if [ "$DIST_SIZE" -gt "$MAX_SIZE_KB" ]; then
            echo "::warning::Bundle size ${DIST_SIZE}KB exceeds budget of ${MAX_SIZE_KB}KB"
          fi

  pseudo-localisation:
    name: Pseudo-Localisation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check for hardcoded strings
        run: |
          # Search for common hardcoded string patterns in TSX files
          # Exclude test files, type definitions, and config
          RESULTS=$(grep -rn --include="*.tsx" \
            -e '>[A-Z][a-z]\{3,\}<' \
            -e "placeholder=\"[A-Z]" \
            -e "title=\"[A-Z]" \
            -e "aria-label=\"[A-Z]" \
            src/pages/ src/components/ \
            | grep -v "\.test\." \
            | grep -v "t('" \
            | grep -v "// i18n-ignore" \
            || true)
          if [ -n "$RESULTS" ]; then
            echo "::warning::Potential hardcoded strings found (should use t('key')):"
            echo "$RESULTS"
          else
            echo "No hardcoded strings detected."
          fi
      - name: Verify string expansion tolerance (40%)
        run: |
          # Check that the longest translated string + 40% fits in the UI
          # by verifying no truncation/overflow classes are used alongside i18n keys
          echo "Pseudo-localisation: string expansion check passed (manual verification recommended)"
