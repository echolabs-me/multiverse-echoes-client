name: CI

# CI scope (public repo): gates that don't require the Multiverse Echoes engine API.
#
# Paths here are from this repository's root (the private monorepo's client/).
#
# e2e/ (Playwright) is run by no workflow, here or in the private
# monorepo's CI (.github/workflows/ there runs no `playwright test`). Its specs
# are for contributors to run locally with `npx playwright test`, which starts
# `npm run dev` (playwright.config.ts):
# - Every spec in e2e/ and e2e/accessibility/ runs on its own
#   with no VITE_ variable set: each mocks the engine API with setupMockApi
#   (e2e/helpers.ts), which also aborts every other HTTP request to
#   another origin and closes every WebSocket to another host. With
#   .env.example's VITE_TURNSTILE_SITE_KEY set, the registration page waits
#   for a token from Cloudflare's Turnstile script, which that abort stops, so
#   a spec that submits that form cannot pass.
# - e2e/live/ needs a running engine: it is excluded from the default
#   config and runs through playwright.live.config.ts against a real deployment.
# See https://developers.echolabsme.com/getting-started for engine access via
# API key.
#
# Every job pins npm before `npm ci`: corepack shims npm to the exact version
# in package.json "packageManager" (npm@11.18.0). The npm a Node release
# bundles need not be that one, and npm 10.x silently drops the libc metadata
# on the optional native entries (@rolldown/binding-*, @tailwindcss/oxide-*,
# lightningcss-*) whenever the lockfile is regenerated;
# the explicit `npm` argument is required, since bare `corepack enable` shims
# only yarn and pnpm.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Runs on every commit ---

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: corepack enable npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: corepack enable npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  touch-targets:
    name: Touch-target Enforcement (ME-ACC-001 §4.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: corepack enable npm
      - run: npm ci
      - run: npm run check-touch-targets

  unit-tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: corepack enable npm
      - run: npm ci
      - run: npm run test

  # --- Runs on PR to main only ---

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: corepack enable npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check bundle size
        run: |
          MAX_SIZE_KB=1500
          DIST_SIZE=$(du -sk dist/ | cut -f1)
          echo "Bundle size: ${DIST_SIZE}KB (budget: ${MAX_SIZE_KB}KB)"
          if [ "$DIST_SIZE" -gt "$MAX_SIZE_KB" ]; then
            echo "::warning::Bundle size ${DIST_SIZE}KB exceeds budget of ${MAX_SIZE_KB}KB"
          fi

  pseudo-localisation:
    name: Pseudo-Localisation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: corepack enable npm
      - run: npm ci
      - name: Check for hardcoded strings
        run: |
          # Search for common hardcoded string patterns in TSX files
          # Exclude test files, type definitions, and config
          RESULTS=$(grep -rn --include="*.tsx" \
            -e '>[A-Z][a-z]\{3,\}<' \
            -e "placeholder=\"[A-Z]" \
            -e "title=\"[A-Z]" \
            -e "aria-label=\"[A-Z]" \
            src/pages/ src/components/ \
            | grep -v "\.test\." \
            | grep -v "t('" \
            | grep -v "// i18n-ignore" \
            || true)
          if [ -n "$RESULTS" ]; then
            echo "::warning::Potential hardcoded strings found (should use t('key')):"
            echo "$RESULTS"
          else
            echo "No hardcoded strings detected."
          fi
      - name: Per-locale string-length sanity check
        run: |
          # Per-locale length-ratio sanity floor — ME-ACC-001 §7.6 v1.1.
          # For every translation key, assert no non-en locale's string
          # exceeds the en.json equivalent by more than 50% characters.
          # This catches gross translation explosion (a sanity floor).
          # Visual layout verification at the 40% UI-expansion threshold
          # is delegated to translator review per spec §7.6 v1.1.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const localesDir = 'src/locales';
            const en = JSON.parse(fs.readFileSync(path.join(localesDir, 'en.json'), 'utf8'));
            const flatten = (obj, prefix='') => {
              const out = {};
              for (const [k, v] of Object.entries(obj)) {
                const key = prefix ? prefix + '.' + k : k;
                if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
                  Object.assign(out, flatten(v, key));
                } else {
                  out[key] = String(v ?? '');
                }
              }
              return out;
            };
            const enFlat = flatten(en);
            const violations = [];
            for (const file of fs.readdirSync(localesDir)) {
              if (!file.endsWith('.json') || file === 'en.json') continue;
              const locale = file.replace(/\\.json$/, '');
              const data = flatten(JSON.parse(fs.readFileSync(path.join(localesDir, file), 'utf8')));
              for (const [key, val] of Object.entries(data)) {
                const enVal = enFlat[key];
                if (!enVal || !val) continue;
                if (val.length > enVal.length * 1.5 && enVal.length > 4) {
                  violations.push(locale + ' ' + key + ' length=' + val.length + ' > en×1.5=' + (enVal.length * 1.5));
                }
              }
            }
            if (violations.length > 0) {
              console.log('::warning::' + violations.length + ' translation keys exceed en×1.5 length floor (sanity check on translation explosion):');
              for (const v of violations.slice(0, 50)) console.log('::warning::' + v);
              if (violations.length > 50) console.log('::warning::... and ' + (violations.length - 50) + ' more');
            } else {
              console.log('Per-locale length-ratio sanity check passed: no key exceeds en×1.5.');
            }
          "
